# Netlify config — static site, no build step.
[build]
  publish = "."
  command = ""

# Clean project URLs
[[redirects]]
  from = "/projects/:name"
  to = "/projects/:name.html"
  status = 200
# Old CV link from the previous site
[[redirects]]
  from = "/David_Obichukwu_Pro_CVword.docx"
  to = "/cv/David_Somadina_Obichukwu_CV.pdf"
  status = 301
[[redirects]]
  from = "/cv/David-Obichukwu-CV.pdf"
  to = "/cv/David_Somadina_Obichukwu_CV.pdf"
  status = 301
# Keep maintenance scripts private
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/cv/*"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "attachment; filename=\"David_Somadina_Obichukwu_CV.pdf\""
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/demo/pitchit/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
